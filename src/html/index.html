<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1f7a86" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="fairyground" />
    <meta
      name="description"
      content="Play and analyze chess variants in the browser with Fairy-Stockfish."
    />
    <title>Fairy-Stockfish playground</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- By curl https://data-url-maker-hiro18181.netlify.app/api/url/https://upload.wikimedia.org/wikipedia/commons/e/ef/Chess_ndt45.svg -->
    <link rel="icon" type="image/png" href="./assets/images/app/logo.png" />
    <link rel="apple-touch-icon" href="./assets/images/app/icon-192.png" />
    <link
      rel="preload"
      href="./assets/fonts/FontAwesome.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./assets/fonts/FontAwesome.woff"
      as="font"
      type="font/woff"
      crossorigin
    />
    <link
      rel="preload"
      href="./assets/fonts/FontAwesome.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link rel="stylesheet" href="assets/chessground.css" />
    <link rel="stylesheet" href="assets/generated.css" />
    <link rel="stylesheet" href="assets/theme-backgrounds.css" />
    <link rel="stylesheet" href="assets/theme-default.css" />
    <link rel="stylesheet" href="assets/app.css" />
    <script>
      // Load the saved (or default dark) UI theme before the first paint so
      // the page does not flash light before the theme system starts.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem("UserSelectedUITheme");
        } catch (e) {}
        if (!theme || !/^[A-Za-z0-9_-]+$/.test(theme)) {
          theme = "dark";
        }
        document.write(
          '<link id="early-ui-theme" rel="stylesheet" href="assets/theme-ui-' +
            theme +
            '.css" />',
        );
      })();
    </script>
    <base target="_blank" />
  </head>

  <body>
    <div id="root"></div>
    <div id="pagebackground" class="pagebackground"></div>
    <div id="pagebackgroundcanvas" class="pagebackgroundcanvas"></div>
    <script>
      //Fairyground namespace for variable/function definition transfer
      window.fairyground = { super: window };
      //Progressive web app: install prompt and offline service worker
      window.fairygroundInstallPrompt = null;
      window.addEventListener("beforeinstallprompt", (event) => {
        event.preventDefault();
        window.fairygroundInstallPrompt = event;
        if (window.m) {
          window.m.redraw();
        }
      });
      if ("serviceWorker" in navigator && location.protocol === "https:") {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch((err) => {
            console.warn("Service worker registration failed:", err);
          });
        });
      }
    </script>

    <!-- Javascript -->

    <script src="./lib/stockfish.js"></script>
    <script>
      if (!Stockfish) {
        let query = new URLSearchParams();
        query.append("title", "Module Error");
        query.append(
          "text",
          "Cannot load fairy-stockfish WASM. Open developer tools and switch to console for more information.",
        );
        let error_page_path = window.location.pathname;
        if (error_page_path.endsWith("/")) {
          error_page_path += "error.html";
        } else {
          error_page_path = error_page_path.replace("index.html", "");
          if (error_page_path.endsWith("/")) {
            error_page_path += "error.html";
          } else {
            error_page_path += "/error.html";
          }
        }
        window.location.replace(
          `${window.location.protocol}//${window.location.host}${error_page_path}?${query.toString()}`,
        );
      }
      window.FairyStockfish = Stockfish;
    </script>
    <script src="gif.js"></script>
    <script src="bundle.js"></script>
  </body>
</html>
